name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deploy-checks:
    name: Run Pre-Deployment Validation & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Dependencies & Run Tests
        run: |
          cd backend
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan test

  deploy:
    name: Deploy to Staging (FTP)
    needs: [pre-deploy-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Deployed Version Metadata & Ephemeral Token
        id: prep
        run: |
          mkdir -p backend/public
          echo "{\"git_sha\": \"${{ github.sha }}\", \"timestamp\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > backend/public/version.json
          
          # Generate ephemeral cryptographically secure deployment token
          RUN_TOKEN=$(openssl rand -hex 32)
          echo "deploy_token=$RUN_TOKEN" >> $GITHUB_OUTPUT
          echo "$RUN_TOKEN" > backend/.deploy_token
          echo "Generated version metadata and ephemeral deployment credentials."

      - name: Zip Application (no vendor, no sqlite, no .env)
        run: |
          cd backend
          zip -rq ../deploy.zip . \
            -x "**/.git*" \
            -x "**/node_modules/**" \
            -x "**/tests/**" \
            -x "*.log" \
            -x "**/*.sqlite" \
            -x "**/.env*" \
            -x "**/vendor/**"
          cd ..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload critical files directly via FTP (strict fail-on-error)
        run: |
          set -euo pipefail

          FTP_USER="${{ secrets.FTP_STAGING_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_STAGING_PASSWORD }}"
          FTP_SERVER="${{ secrets.FTP_SERVER }}"

          upload_file() {
            local src="$1"
            local dest="$2"
            echo "Uploading $src -> ftp://$FTP_SERVER/$dest"
            curl -s --fail --retry 5 --max-time 60 --ftp-create-dirs -T "$src" \
              "ftp://$FTP_SERVER/$dest" \
              --user "$FTP_USER:$FTP_PASS"
            echo "OK: $dest"
          }

          # Ephemeral Deployment Token & Versioning
          upload_file backend/.deploy_token              .deploy_token
          upload_file backend/public/version.json         public/version.json

          # Critical entry points
          upload_file backend/public/unzip.php           public/unzip.php
          upload_file backend/public/index.php           public/index.php
          upload_file backend/public/images/guides/amazon-price-audit-animation.svg public/images/guides/amazon-price-audit-animation.svg

          # Routes
          upload_file backend/routes/web.php             routes/web.php
          upload_file backend/routes/api.php             routes/api.php

          # Core Models, Controllers & Services
          upload_file backend/app/Models/Deal.php         app/Models/Deal.php
          upload_file backend/app/Models/Category.php     app/Models/Category.php
          upload_file backend/app/Http/Controllers/Frontend/BrowseController.php app/Http/Controllers/Frontend/BrowseController.php
          upload_file backend/app/Http/Controllers/ShopperAuthController.php app/Http/Controllers/ShopperAuthController.php
          upload_file backend/app/Http/Controllers/PublisherAuthController.php app/Http/Controllers/PublisherAuthController.php
          upload_file backend/app/Http/Controllers/Admin/DealController.php app/Http/Controllers/Admin/DealController.php
