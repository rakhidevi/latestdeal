name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production (FTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Application (no vendor, no sqlite, no .env)
        run: |
          cd backend
          zip -rq ../deploy.zip . \
            -x "**/.git*" \
            -x "**/node_modules/**" \
            -x "**/tests/**" \
            -x "*.log" \
            -x "**/*.sqlite" \
            -x "**/.env*" \
            -x "**/vendor/**"
          cd ..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload critical files directly via FTP (bypass zip timeout)
        run: |
          FTP_USER="${{ secrets.FTP_PRODUCTION_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_PRODUCTION_PASSWORD }}"
          FTP_SERVER="${{ secrets.FTP_SERVER }}"

          upload_file() {
            local src="$1"
            local dest="$2"
            echo "Uploading $src -> ftp://$FTP_SERVER/$dest"
            curl -s --retry 5 --max-time 60 -T "$src" \
              "ftp://$FTP_SERVER/$dest" \
              --user "$FTP_USER:$FTP_PASS" && echo "OK" || echo "FAILED"
          }

          # Critical entry point
          upload_file backend/public/index.php           public/index.php
          upload_file backend/public/unzip.php           public/unzip.php

          # Routes
          upload_file backend/routes/web.php             routes/web.php
          upload_file backend/routes/api.php             routes/api.php

          # Core Models, Controllers & Services
          upload_file backend/app/Models/Deal.php         app/Models/Deal.php
          upload_file backend/app/Http/Controllers/Frontend/BrowseController.php app/Http/Controllers/Frontend/BrowseController.php
          upload_file backend/app/Http/Controllers/ShopperAuthController.php app/Http/Controllers/ShopperAuthController.php
          upload_file backend/app/Http/Controllers/PublisherAuthController.php app/Http/Controllers/PublisherAuthController.php
          upload_file backend/app/Http/Controllers/Admin/DealController.php app/Http/Controllers/Admin/DealController.php
          upload_file backend/app/Http/Controllers/Admin/CategoryController.php app/Http/Controllers/Admin/CategoryController.php
          upload_file backend/app/Http/Controllers/Admin/BrandController.php app/Http/Controllers/Admin/BrandController.php
          upload_file backend/app/Http/Controllers/Admin/NewsletterController.php app/Http/Controllers/Admin/NewsletterController.php
          upload_file backend/app/Http/Controllers/Admin/SettingController.php app/Http/Controllers/Admin/SettingController.php
          upload_file backend/app/Services/Admin/SettingService.php app/Services/Admin/SettingService.php
          upload_file backend/app/Services/Admin/DealAdminService.php app/Services/Admin/DealAdminService.php
          upload_file backend/app/Services/SearchPipeline/FilterNormalizer.php app/Services/SearchPipeline/FilterNormalizer.php
          upload_file backend/app/Services/SearchPipeline/Pipes/ApplyRanking.php app/Services/SearchPipeline/Pipes/ApplyRanking.php
          upload_file backend/app/Services/RecommendationService.php app/Services/RecommendationService.php
          upload_file backend/app/Services/Admin/DashboardService.php app/Services/Admin/DashboardService.php

          # Layouts & Public Pages
          upload_file "backend/resources/views/layouts/app.blade.php" "resources/views/layouts/app.blade.php"
          upload_file backend/resources/views/pages/about.blade.php       resources/views/pages/about.blade.php
          upload_file backend/resources/views/pages/contact.blade.php     resources/views/pages/contact.blade.php
          upload_file backend/resources/views/pages/privacy.blade.php     resources/views/pages/privacy.blade.php
          upload_file backend/resources/views/pages/terms.blade.php       resources/views/pages/terms.blade.php
          upload_file backend/resources/views/pages/disclosure.blade.php  resources/views/pages/disclosure.blade.php

          # Admin Views
          upload_file backend/resources/views/admin/layout.blade.php resources/views/admin/layout.blade.php
          upload_file backend/resources/views/admin/deals.blade.php resources/views/admin/deals.blade.php
          upload_file backend/resources/views/admin/deals/create.blade.php resources/views/admin/deals/create.blade.php
          upload_file backend/resources/views/admin/deals/edit.blade.php resources/views/admin/deals/edit.blade.php
          upload_file backend/resources/views/admin/categories.blade.php resources/views/admin/categories.blade.php
          upload_file backend/resources/views/admin/brands.blade.php resources/views/admin/brands.blade.php
          upload_file backend/resources/views/admin/settings.blade.php resources/views/admin/settings.blade.php
          upload_file backend/resources/views/admin/marketing/templates_manager.blade.php resources/views/admin/marketing/templates_manager.blade.php
          upload_file backend/resources/views/admin/marketing/preview_page.blade.php resources/views/admin/marketing/preview_page.blade.php
          upload_file backend/resources/views/admin/marketing/subscribers_manager.blade.php resources/views/admin/marketing/subscribers_manager.blade.php
          upload_file backend/resources/views/admin/marketing/dispatch_campaign.blade.php resources/views/admin/marketing/dispatch_campaign.blade.php
          upload_file backend/resources/views/admin/actions.blade.php resources/views/admin/actions.blade.php
          upload_file backend/resources/views/emails/promo-deal-digest.blade.php resources/views/emails/promo-deal-digest.blade.php
          upload_file backend/resources/views/emails/promo-deal-digest-plain.blade.php resources/views/emails/promo-deal-digest-plain.blade.php
          upload_file backend/resources/views/livewire/admin/studio/admin-center.blade.php resources/views/livewire/admin/studio/admin-center.blade.php

          echo "Direct file uploads complete."

      - name: Upload full deploy.zip via FTP
        run: |
          echo "Uploading deploy.zip..."
          curl -s --retry 3 --max-time 300 -T deploy.zip \
            ftp://${{ secrets.FTP_SERVER }}/ \
            --user "${{ secrets.FTP_PRODUCTION_USERNAME }}:${{ secrets.FTP_PRODUCTION_PASSWORD }}" \
            && echo "deploy.zip uploaded OK" || echo "deploy.zip upload FAILED (non-fatal)"

      - name: Trigger Extraction + DB Repair on Production
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          DEPLOY_TOKEN="${{ secrets.DEPLOY_KEY || secrets.WORKER_API_KEY || 'ld_deploy_8f29c018a4d74996b72f10b24083a65c92df83021948ad72' }}"

          echo "--- Fixing artisan permissions + clearing bootstrap cache + OPcache reset + Purging scripts ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://latestdeal.in/unzip.php?fix_perms=1&token=$DEPLOY_TOKEN"

          echo "--- Extracting deploy.zip (if upload succeeded) ---"
          curl -s --max-time 120 -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://latestdeal.in/unzip.php?token=$DEPLOY_TOKEN" || echo "unzip skipped (zip not uploaded)"

          echo "--- Running migrations ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://latestdeal.in/unzip.php?migrate=1&token=$DEPLOY_TOKEN"

          echo "--- Patching APP_URL + storage symlink ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://latestdeal.in/unzip.php?fix_url=1&token=$DEPLOY_TOKEN"

          echo "--- Refreshing OPcache and permissions ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://latestdeal.in/unzip.php?fix_perms=1&token=$DEPLOY_TOKEN"

          echo "--- Done ---"

