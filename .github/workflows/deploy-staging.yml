          echo "Direct file uploads complete."

      - name: Upload full deploy.zip via FTP (strict fail-on-error)
        run: |
          set -euo pipefail
          echo "Uploading deploy.zip..."
          curl -s --fail --retry 3 --max-time 300 -T deploy.zip \
            "ftp://${{ secrets.FTP_SERVER }}/deploy.zip" \
            --user "${{ secrets.FTP_STAGING_USERNAME }}:${{ secrets.FTP_STAGING_PASSWORD }}"
          echo "deploy.zip uploaded successfully."

      - name: Trigger Extraction + DB Repair on Staging
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          DEPLOY_TOKEN="${{ steps.prep.outputs.deploy_token }}"

          echo "--- Fixing artisan permissions + clearing bootstrap cache + OPcache reset ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_perms=1"

          echo "--- Extracting deploy.zip ---"
          curl -s --fail --max-time 120 -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php"

          echo "--- Running migrations ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?migrate=1"

          echo "--- Seeding default admin user ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?seed_admin=1"

          echo "--- Patching APP_URL + storage symlink ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_url=1"

          echo "--- Refreshing OPcache and permissions ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_perms=1"

          echo "--- Reclassifying catalog and cleaning bogus categories ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?reclassify_catalog=1"

          echo "--- Cleaning ephemeral deployment credentials ---"
          curl -s --fail -A "$UA" -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?cleanup_token=1"

          echo "--- Remote extraction and maintenance routines finished ---"

      - name: Verify Deployed Release Revision against git HEAD
        run: |
          set -euo pipefail
          echo "--- Checking deployed git commit on Staging ---"
          DEPLOYED_RAW=$(curl -s --fail "https://staging.latestdeal.in/version.json")
          echo "Server response: $DEPLOYED_RAW"
          DEPLOYED_SHA=$(echo "$DEPLOYED_RAW" | grep -o '"git_sha": *"[^"]*"' | cut -d'"' -f4)
          EXPECTED_SHA="${{ github.sha }}"
          echo "Expected git SHA: $EXPECTED_SHA"
          echo "Deployed git SHA: $DEPLOYED_SHA"
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            echo "FATAL: Deployed revision mismatch! Expected $EXPECTED_SHA but got $DEPLOYED_SHA"
            exit 1
          fi
          echo "Release verification confirmed! Staging is actively serving commit $EXPECTED_SHA."
