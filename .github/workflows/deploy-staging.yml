          upload_file backend/app/Http/Controllers/Admin/SettingController.php app/Http/Controllers/Admin/SettingController.php
          upload_file backend/app/Providers/AppServiceProvider.php app/Providers/AppServiceProvider.php
          upload_file backend/app/Mail/PromoDealDigestMail.php app/Mail/PromoDealDigestMail.php
          upload_file backend/app/Mail/WelcomeShopperMail.php app/Mail/WelcomeShopperMail.php
          upload_file backend/app/Mail/NewsletterWelcomeMail.php app/Mail/NewsletterWelcomeMail.php
          upload_file backend/routes/console.php routes/console.php

          upload_file backend/app/Services/Admin/SettingService.php app/Services/Admin/SettingService.php
          upload_file backend/app/Services/Admin/DealAdminService.php app/Services/Admin/DealAdminService.php
          upload_file backend/app/Services/SearchPipeline/FilterNormalizer.php app/Services/SearchPipeline/FilterNormalizer.php
          upload_file backend/app/Services/SearchPipeline/Pipes/ApplyRanking.php app/Services/SearchPipeline/Pipes/ApplyRanking.php
          upload_file backend/app/Services/SearchPipeline/Pipes/ApplyFilters.php app/Services/SearchPipeline/Pipes/ApplyFilters.php
          upload_file backend/app/Http/Controllers/Api/DealIngestionController.php app/Http/Controllers/Api/DealIngestionController.php
          upload_file backend/app/Services/RecommendationService.php app/Services/RecommendationService.php
          upload_file backend/app/Services/Admin/DashboardService.php app/Services/Admin/DashboardService.php
          upload_file backend/app/Http/Controllers/Api/PriceUpdateController.php app/Http/Controllers/Api/PriceUpdateController.php
          upload_file backend/app/Http/Controllers/Api/LiveComparisonController.php app/Http/Controllers/Api/LiveComparisonController.php
          upload_file backend/app/Http/Controllers/Api/PricePredictionController.php app/Http/Controllers/Api/PricePredictionController.php
          upload_file backend/app/Http/Controllers/Api/SmartSearchController.php app/Http/Controllers/Api/SmartSearchController.php
          upload_file backend/app/Http/Controllers/Api/ShopperAssistantController.php app/Http/Controllers/Api/ShopperAssistantController.php
          upload_file backend/app/Services/Catalog/BrandResolver.php app/Services/Catalog/BrandResolver.php
