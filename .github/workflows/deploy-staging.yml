          upload_file backend/app/Http/Controllers/DirectoryController.php app/Http/Controllers/DirectoryController.php
          upload_file backend/app/Console/Commands/ReclassifyCatalogCommand.php app/Console/Commands/ReclassifyCatalogCommand.php
          upload_file backend/resources/views/shopper/assistant.blade.php resources/views/shopper/assistant.blade.php

          # Editorial & Guides Engine
          upload_file backend/app/DTOs/Editorial/GuideArticleDTO.php app/DTOs/Editorial/GuideArticleDTO.php
          upload_file backend/app/Services/Editorial/Contracts/GuideArticleGeneratorInterface.php app/Services/Editorial/Contracts/GuideArticleGeneratorInterface.php
          upload_file backend/app/Services/Editorial/GuideArticleGeneratorService.php app/Services/Editorial/GuideArticleGeneratorService.php
          upload_file backend/app/Services/Editorial/ProductionGuidesContent.php app/Services/Editorial/ProductionGuidesContent.php
          upload_file backend/app/Console/Commands/GenerateGuideArticleCommand.php app/Console/Commands/GenerateGuideArticleCommand.php
          upload_file backend/app/Models/Article.php app/Models/Article.php

          # Migrations & Seeders
          upload_file backend/database/migrations/2026_10_26_000001_add_deal_id_to_articles_table.php database/migrations/2026_10_26_000001_add_deal_id_to_articles_table.php
          upload_file backend/database/migrations/2026_10_26_000002_upgrade_guide_articles_to_google_compliance.php database/migrations/2026_10_26_000002_upgrade_guide_articles_to_google_compliance.php
          upload_file backend/database/migrations/2026_10_26_000003_update_guide_articles_to_2026.php database/migrations/2026_10_26_000003_update_guide_articles_to_2026.php
          upload_file backend/database/migrations/2026_10_27_000001_fix_guide_article_button_visibility.php database/migrations/2026_10_27_000001_fix_guide_article_button_visibility.php
          upload_file backend/database/migrations/2026_10_27_000002_localize_guides_for_india.php database/migrations/2026_10_27_000002_localize_guides_for_india.php
          upload_file backend/database/migrations/2026_10_27_000003_update_guide_featured_image_to_animation.php database/migrations/2026_10_27_000003_update_guide_featured_image_to_animation.php
          upload_file backend/database/migrations/2026_10_29_000001_update_deal_destination_urls.php database/migrations/2026_10_29_000001_update_deal_destination_urls.php
          upload_file backend/app/Http/Controllers/ArticleController.php app/Http/Controllers/ArticleController.php
          upload_file backend/database/seeders/ArticleSeeder.php database/seeders/ArticleSeeder.php
          upload_file backend/database/seeders/RealDealSeeder.php database/seeders/RealDealSeeder.php
          upload_file backend/database/seeders/deals_seed_data.json database/seeders/deals_seed_data.json
          upload_file backend/resources/views/articles/show.blade.php resources/views/articles/show.blade.php

          # Layouts & Public Pages
          upload_file backend/resources/views/welcome.blade.php resources/views/welcome.blade.php
          upload_file backend/resources/views/components/deal-card.blade.php resources/views/components/deal-card.blade.php
          upload_file backend/resources/views/components/ad-banner.blade.php resources/views/components/ad-banner.blade.php
          upload_file backend/resources/views/partials/deals_grid.blade.php resources/views/partials/deals_grid.blade.php
          upload_file "backend/resources/views/layouts/app.blade.php" "resources/views/layouts/app.blade.php"
          upload_file backend/resources/views/deals/show.blade.php resources/views/deals/show.blade.php
          upload_file backend/resources/views/sitemap.blade.php resources/views/sitemap.blade.php
          upload_file backend/resources/views/about.blade.php resources/views/about.blade.php
          upload_file backend/resources/views/editorial-policy.blade.php resources/views/editorial-policy.blade.php
          upload_file backend/resources/views/corrections-policy.blade.php resources/views/corrections-policy.blade.php
          upload_file backend/resources/views/cookie-policy.blade.php resources/views/cookie-policy.blade.php
          upload_file backend/resources/views/how-it-works.blade.php resources/views/how-it-works.blade.php
          upload_file backend/resources/views/affiliate-disclosure.blade.php resources/views/affiliate-disclosure.blade.php
          upload_file backend/resources/views/editorial-team.blade.php resources/views/editorial-team.blade.php
          upload_file backend/resources/views/privacy.blade.php resources/views/privacy.blade.php
          upload_file backend/resources/views/terms.blade.php resources/views/terms.blade.php
          upload_file backend/resources/views/contact.blade.php resources/views/contact.blade.php
          upload_file backend/resources/views/pages/about.blade.php       resources/views/pages/about.blade.php
          upload_file backend/resources/views/pages/contact.blade.php     resources/views/pages/contact.blade.php
          upload_file backend/resources/views/pages/privacy.blade.php     resources/views/pages/privacy.blade.php
          upload_file backend/resources/views/pages/terms.blade.php       resources/views/pages/terms.blade.php
          upload_file backend/resources/views/pages/disclosure.blade.php  resources/views/pages/disclosure.blade.php
          upload_file backend/resources/views/auth/shopper-login.blade.php resources/views/auth/shopper-login.blade.php
          upload_file backend/resources/views/auth/forgot-password.blade.php resources/views/auth/forgot-password.blade.php

          # Admin Views
          upload_file backend/resources/views/admin/layout.blade.php resources/views/admin/layout.blade.php
          upload_file backend/resources/views/admin/deals.blade.php resources/views/admin/deals.blade.php
          upload_file backend/resources/views/admin/deals/create.blade.php resources/views/admin/deals/create.blade.php
          upload_file backend/resources/views/admin/deals/edit.blade.php resources/views/admin/deals/edit.blade.php
          upload_file backend/resources/views/admin/categories.blade.php resources/views/admin/categories.blade.php
          upload_file backend/resources/views/admin/brands.blade.php resources/views/admin/brands.blade.php
          upload_file backend/resources/views/admin/settings.blade.php resources/views/admin/settings.blade.php
          upload_file backend/resources/views/admin/marketing/templates_manager.blade.php resources/views/admin/marketing/templates_manager.blade.php
          upload_file backend/resources/views/admin/marketing/preview_page.blade.php resources/views/admin/marketing/preview_page.blade.php
          upload_file backend/resources/views/admin/marketing/subscribers_manager.blade.php resources/views/admin/marketing/subscribers_manager.blade.php
          upload_file backend/resources/views/admin/marketing/dispatch_campaign.blade.php resources/views/admin/marketing/dispatch_campaign.blade.php
          upload_file backend/resources/views/admin/actions.blade.php resources/views/admin/actions.blade.php
          upload_file backend/resources/views/emails/promo-deal-digest.blade.php resources/views/emails/promo-deal-digest.blade.php
          upload_file backend/resources/views/emails/promo-deal-digest-plain.blade.php resources/views/emails/promo-deal-digest-plain.blade.php
          upload_file backend/resources/views/livewire/admin/studio/admin-center.blade.php resources/views/livewire/admin/studio/admin-center.blade.php
