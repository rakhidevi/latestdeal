name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging (FTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Application (no vendor, no sqlite, no .env)
        run: |
          cd backend
          zip -rq ../deploy.zip . \
            -x "**/.git*" \
            -x "**/node_modules/**" \
            -x "**/tests/**" \
            -x "*.log" \
            -x "**/*.sqlite" \
            -x "**/.env*" \
            -x "**/vendor/**"
          cd ..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload critical files directly via FTP (bypass zip timeout)
        run: |
          FTP_USER="${{ secrets.FTP_STAGING_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_STAGING_PASSWORD }}"
          FTP_SERVER="${{ secrets.FTP_SERVER }}"

          upload_file() {
            local src="$1"
            local dest="$2"
            echo "Uploading $src -> ftp://$FTP_SERVER/$dest"
            curl -s --retry 5 --max-time 60 -T "$src" \
              "ftp://$FTP_SERVER/$dest" \
              --user "$FTP_USER:$FTP_PASS" && echo "OK" || echo "FAILED"
          }

          # Critical entry points
          upload_file backend/public/unzip.php           public/unzip.php
          upload_file backend/public/index.php           public/index.php

          # Routes
          upload_file backend/routes/web.php             routes/web.php
          upload_file backend/routes/api.php             routes/api.php

          # Core Models, Controllers & Services
          upload_file backend/app/Models/Deal.php         app/Models/Deal.php
          upload_file backend/app/Http/Controllers/Frontend/BrowseController.php app/Http/Controllers/Frontend/BrowseController.php
          upload_file backend/app/Http/Controllers/ShopperAuthController.php app/Http/Controllers/ShopperAuthController.php
          upload_file backend/app/Http/Controllers/PublisherAuthController.php app/Http/Controllers/PublisherAuthController.php
          upload_file backend/app/Services/RecommendationService.php app/Services/RecommendationService.php
          upload_file backend/app/Services/Admin/DashboardService.php app/Services/Admin/DashboardService.php
          upload_file backend/resources/views/livewire/admin/studio/admin-center.blade.php resources/views/livewire/admin/studio/admin-center.blade.php

          echo "Direct file uploads complete."

      - name: Upload full deploy.zip via FTP
        run: |
          echo "Uploading deploy.zip..."
          curl -s --retry 3 --max-time 300 -T deploy.zip \
            "ftp://${{ secrets.FTP_SERVER }}/deploy.zip" \
            --user "${{ secrets.FTP_STAGING_USERNAME }}:${{ secrets.FTP_STAGING_PASSWORD }}" \
            && echo "deploy.zip uploaded OK" || echo "deploy.zip upload FAILED (non-fatal)"

      - name: Trigger Extraction + Repair on Staging
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          DEPLOY_TOKEN="${{ secrets.DEPLOY_KEY || secrets.WORKER_API_KEY || 'ld_deploy_8f29c018a4d74996b72f10b24083a65c92df83021948ad72' }}"

          echo "--- Fixing artisan permissions + clearing bootstrap cache + OPcache reset ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_perms=1&token=$DEPLOY_TOKEN"

          echo "--- Extracting deploy.zip (if upload succeeded) ---"
          curl -s --max-time 120 -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?token=$DEPLOY_TOKEN" || echo "unzip skipped (zip not uploaded)"

          echo "--- Running migrations ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?migrate=1&token=$DEPLOY_TOKEN"

          echo "--- Seeding default admin user ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?seed_admin=1&token=$DEPLOY_TOKEN"

          echo "--- Patching APP_URL + storage symlink ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_url=1&token=$DEPLOY_TOKEN"

          echo "--- Refreshing OPcache and permissions ---"
          curl -s -A "$UA" -H "X-Deploy-Token: $DEPLOY_TOKEN" "https://staging.latestdeal.in/unzip.php?fix_perms=1&token=$DEPLOY_TOKEN"

          echo "--- Done ---"
