name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production (FTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Zip Application (no vendor, no sqlite, no .env)
        run: |
          cd backend
          zip -rq ../deploy.zip . \
            -x "**/.git*" \
            -x "**/node_modules/**" \
            -x "**/tests/**" \
            -x "*.log" \
            -x "**/*.sqlite" \
            -x "**/.env*" \
            -x "**/vendor/**"
          cd ..
          echo "deploy.zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload critical files directly via FTP (bypass zip timeout)
        run: |
          FTP_USER="${{ secrets.FTP_PRODUCTION_USERNAME }}"
          FTP_PASS="${{ secrets.FTP_PRODUCTION_PASSWORD }}"
          FTP_SERVER="${{ secrets.FTP_SERVER }}"

          upload_file() {
            local src="$1"
            local dest="$2"
            echo "Uploading $src -> ftp://$FTP_SERVER/$dest"
            curl -s --retry 5 --max-time 60 -T "$src" \
              "ftp://$FTP_SERVER/$dest" \
              --user "$FTP_USER:$FTP_PASS" && echo "OK" || echo "FAILED"
          }

          # Critical entry point
          upload_file backend/public/index.php           public/index.php
          upload_file backend/public/unzip.php           public/unzip.php

          # Routes
          upload_file backend/routes/web.php             routes/web.php

          # Layouts
          upload_file "backend/resources/views/layouts/app.blade.php" "resources/views/layouts/app.blade.php"

          # Compliance pages (create dir first via a dummy upload)
          upload_file backend/resources/views/pages/about.blade.php       resources/views/pages/about.blade.php
          upload_file backend/resources/views/pages/contact.blade.php     resources/views/pages/contact.blade.php
          upload_file backend/resources/views/pages/privacy.blade.php     resources/views/pages/privacy.blade.php
          upload_file backend/resources/views/pages/terms.blade.php       resources/views/pages/terms.blade.php
          upload_file backend/resources/views/pages/disclosure.blade.php  resources/views/pages/disclosure.blade.php

          # Utility scripts
          upload_file backend/public/fix_deals.php       public/fix_deals.php
          upload_file backend/public/fix_images.php      public/fix_images.php
          upload_file backend/public/recovery_30days.php public/recovery_30days.php

          echo "Direct file uploads complete."

      - name: Upload full deploy.zip via FTP
        run: |
          echo "Uploading deploy.zip..."
          curl -s --retry 3 --max-time 300 -T deploy.zip \
            ftp://${{ secrets.FTP_SERVER }}/ \
            --user "${{ secrets.FTP_PRODUCTION_USERNAME }}:${{ secrets.FTP_PRODUCTION_PASSWORD }}" \
            && echo "deploy.zip uploaded OK" || echo "deploy.zip upload FAILED (non-fatal)"

      - name: Trigger Extraction + DB Repair on Production
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          echo "--- Fixing artisan permissions + clearing bootstrap cache + OPcache reset ---"
          curl -s -A "$UA" "https://latestdeal.in/unzip.php?fix_perms=1"

          echo "--- Extracting deploy.zip (if upload succeeded) ---"
          curl -s --max-time 120 -A "$UA" https://latestdeal.in/unzip.php || echo "unzip skipped (zip not uploaded)"

          echo "--- Running migrations ---"
          curl -s -A "$UA" "https://latestdeal.in/unzip.php?migrate=1"

          echo "--- Patching APP_URL + storage symlink ---"
          curl -s -A "$UA" "https://latestdeal.in/unzip.php?fix_url=1"

          echo "--- Fixing broken deal editorial fields in DB ---"
          curl -s -A "$UA" https://latestdeal.in/fix_deals.php

          echo "--- Done ---"
